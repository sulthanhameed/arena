# ════════════════════════════════════════════════════════════════════════
#  Supabase CLI configuration — `supabase start` reads this file.
#  Docs: https://supabase.com/docs/guides/local-development/cli/config
# ════════════════════════════════════════════════════════════════════════

project_id = "khang"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Catches every outbound email locally (signup confirmations, magic links…)
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.menu-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/avif"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:4173",
  "https://khang.vercel.app",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local dev convenience: no inbox round-trip required to sign in.
# Turn this ON in the hosted dashboard for production.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
min_password_length = 6

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# ─────────────────────────────────────────────────────────────
# Stripe signs its webhooks itself — it cannot send a Supabase JWT,
# so JWT verification has to be off for this one function.
# ─────────────────────────────────────────────────────────────
[functions.stripe-webhook]
verify_jwt = false

[functions.razorpay-create-order]
verify_jwt = true

[functions.razorpay-verify]
verify_jwt = true

[functions.stripe-create-intent]
verify_jwt = true

[functions.refund-order]
verify_jwt = true

[functions.notify-order]
verify_jwt = true
